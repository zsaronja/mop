spring:
  application:
    name: mop

  datasource:
    url: jdbc:postgresql://postgres:5432/mop_cart_db
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: redis
      port: 6379

  security:
      oauth2:
        resourceserver:
          jwt:
            jwk-set-uri: http://keycloak:8080/realms/mop/protocol/openid-connect/certs

server:
  port: 8080

logging:
  level:
    root: INFO
    "[com.example.mop]": DEBUG
    "[org.springframework.data.redis]": DEBUG
    "[org.hibernate.SQL]": DEBUG

resilience4j:
  circuitbreaker:
    instances:
      redisService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s